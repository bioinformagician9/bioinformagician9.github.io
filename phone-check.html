<script>
var q=new URLSearchParams(location.search),W=+(q.get('w')||375),f=document.getElementById('f'),r=document.getElementById('r');
f.style.width=W+'px';f.src=(q.get('src')||'phone-check-site.html')+'?'+Date.now()+(q.get('h')||'');
['top','atlas','trajectory','protocols','library','reference','interactome','deposit'].forEach(function(s){var x=document.createElement('button');x.textContent=s;x.onclick=function(){var d=f.contentDocument,e=d.getElementById(s);if(e)e.scrollIntoView();else f.contentWindow.scrollTo(0,0);setTimeout(m,400)};document.getElementById('b').appendChild(x)});
